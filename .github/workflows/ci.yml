name: CI
on: { pull_request: {} }
concurrency:
  group: ${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  setup-build:
    runs-on: ubuntu-latest
    outputs:
      tox_envs: ${{ steps.list_envs.outputs.tox_envs }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-python-environment
        with:
          install_dependencies: false

      - id: list_envs
        run: |
          tox_envs=$(
            tox --listenvs | \
            jq -Rnc '[inputs | sub("\\.yml$"; "")]'
          )
          echo "tox_envs=${tox_envs}" >> $GITHUB_OUTPUT

  test:
    runs-on: ubuntu-latest
    needs: [setup-build]
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.setup-build.outputs.tox_envs) }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-python-environment

      - name: Run tox target
        run: |
          [[ ! -d source/_static ]] && mkdir -p source/_static
          poetry run tox --current-env -e ${{ matrix.target }}
