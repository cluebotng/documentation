[project]
name = "documentation"
requires-python = ">=3.15"
dependencies = [
    "sphinx (>=9.2.0,<10.0.0)",
    "tox (>=4.67.12,<5.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.test.dependencies]
tox = "^4.67.12"
tox-current-env = "^0.0.17"
black = "^26.10.1"
ruff = "^0.17.4"
bandit = "^1.9.4"
doc8 = "^2.0.0"

[tool.doc8]
max-line-length = 120

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
